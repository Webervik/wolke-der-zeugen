# Wolke der Zeugen – Abschnitt für den HTTPS-Server-Block von www.viktor-weber.com.
# Liegt auf dem Server als /etc/nginx/snippets/wolke-der-zeugen.conf und wird im
# Block der Homepage direkt unter der Zeile von Zwölf Steine eingebunden:
#     include snippets/wolke-der-zeugen.conf;
#
# Das Spiel liegt in /var/www/wolke-der-zeugen/, getrennt von der Homepage.
# „^~“ sorgt dafür, dass die Regex-Regeln der Homepage (z. B. .js/.css mit
# „public, immutable“ und 30 Tagen) nicht in den Spielpfad hineinwirken.
#
# Wichtig: nginx erbt add_header nicht in Blöcke, die selbst add_header setzen.
# Deshalb steht HSTS (sonst auf Server-Ebene gesetzt) hier noch einmal.

# /wolke-der-zeugen ohne Schrägstrich → mit Schrägstrich
location = /wolke-der-zeugen {
    return 301 /wolke-der-zeugen/;
}

location ^~ /wolke-der-zeugen/ {
    root /var/www;                 # /wolke-der-zeugen/x → /var/www/wolke-der-zeugen/x
    index index.html;
    try_files $uri $uri/ =404;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json application/manifest+json;

    # Die Spielenden sind Konfis, also meist minderjährig: Aufrufe nicht
    # protokollieren (keine IP-Adressen im Zugriffsprotokoll).
    access_log off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 512;

    # Die Dateinamen tragen keine Versionsnummer. Darum fragt der Browser bei
    # jedem Laden kurz nach (Antwort meist 304, wenige Bytes). So kommt jede
    # neue Version sofort an; offline hilft der Service Worker.
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Das Spiel erreicht man über die QR-Bögen, nicht über Suchmaschinen
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Web-Manifest mit richtigem MIME-Typ
    location ~ \.webmanifest$ {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Werkstatt, Notizen und Git gehören nicht ins Netz (werden auch nicht hochgeladen)
    location ~ (/\.|/werkstatt/|/deploy/|\.md$) {
        return 404;
    }
}
